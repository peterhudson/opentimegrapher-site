{{ define "main" }}
<div class="wrap doc">
  {{ partial "docnav.html" . }}
  <article class="prose">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
    {{ if eq .Section "math" }}
    <ol class="toc">{{ range .Pages.ByWeight }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ol>
    {{ end }}
  </article>
</div>
{{ end }}
