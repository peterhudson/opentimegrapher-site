<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ "/" | relLangURL }}" aria-label="{{ site.Title }} home">
      {{ partial "mark.html" . }}<span>Open Timegrapher</span>
    </a>
    {{- $current := . }}
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <svg class="when-closed" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><svg class="when-open" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="when-closed">Menu</span><span class="when-open">Close</span>
    </button>
    <nav id="site-nav" aria-label="Main">
      {{- range site.Menus.main }}{{ if ne .Name "Download" }}
      <a href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (and .Page (eq $current.Section .Page.Section) (ne $current.Section "")) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}{{ end }}
    </nav>
    {{- range site.Menus.main }}{{ if eq .Name "Download" }}
    <a class="nav-cta" href="{{ .URL }}"{{ if or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (and .Page (eq $current.Section .Page.Section) (ne $current.Section "")) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}{{ end }}
  </div>
</header>
<script>
(function(){
  var h=document.querySelector(".site-header"),b=h&&h.querySelector(".menu-toggle"),n=document.getElementById("site-nav");
  if(!b||!n)return;
  var narrow=matchMedia("(max-width:699.98px)");
  function set(open){b.setAttribute("aria-expanded",open?"true":"false");h.classList.toggle("menu-open",open)}
  h.classList.add("has-menu");
  b.addEventListener("click",function(){set(b.getAttribute("aria-expanded")!=="true")});
  n.addEventListener("click",function(e){if(e.target.closest("a"))set(false)});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&h.classList.contains("menu-open")){set(false);b.focus()}});
  narrow.addEventListener("change",function(){set(false)});
})();
</script>
