{{ define "schema" }}
<script type="application/ld+json">{{ dict "@context" "https://schema.org" "@type" "Article" "headline" .Title "datePublished" (.Date.Format "2006-01-02") "author" (dict "@type" "Person" "name" (or (index (index site.Data.authors (.Params.author | default "")) "name") .Params.author "Open Timegrapher")) "publisher" (dict "@type" "Organization" "name" site.Title) | jsonify | safeJS }}</script>
{{ end }}
{{ define "main" }}
<div class="wrap narrow">
  <article class="prose">
    <p class="eyebrow"><a href="/blog/">Blog</a> · <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time></p>
    <h1>{{ .Title }}</h1>
    {{ partial "byline.html" . }}
    {{ .Content }}
  </article>
</div>
{{- /* Click an image to see it larger; click anywhere or press Esc to close. */}}
<dialog class="lightbox" aria-label="Enlarged image"><img alt=""></dialog>
<script>
(function(){
  var d=document.querySelector("dialog.lightbox");
  if(!d||!d.showModal)return;
  var im=d.querySelector("img");
  document.querySelectorAll("a.zoom").forEach(function(a){
    a.addEventListener("click",function(e){
      e.preventDefault();
      var s=a.querySelector("img");
      im.src=a.href; im.alt=s?s.alt:"";
      d.showModal();
    });
  });
  d.addEventListener("click",function(){d.close()});
  d.addEventListener("close",function(){im.removeAttribute("src")});
})();
</script>
{{ end }}
