<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" fill="#f4efe6"/>
  <!-- watch dial -->
  <circle cx="160" cy="150" r="62" fill="#fffdf8" stroke="#3a3a3a" stroke-width="4"/>
  <g stroke="#3a3a3a" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="96" x2="160" y2="106"/><line x1="160" y1="194" x2="160" y2="204"/>
    <line x1="106" y1="150" x2="116" y2="150"/><line x1="204" y1="150" x2="214" y2="150"/>
    <line x1="160" y1="150" x2="160" y2="116"/><line x1="160" y1="150" x2="184" y2="160"/>
  </g>
  <circle cx="160" cy="150" r="4" fill="#3a3a3a"/>
  <!-- three head outlines watching -->
  <g fill="none" stroke-width="4">
    <g stroke="#2f6f9f"><circle cx="58" cy="78" r="20"/><path d="M28 128 q30 -36 60 0"/></g>
    <g stroke="#b5651d"><circle cx="262" cy="78" r="20"/><path d="M232 128 q30 -36 60 0"/></g>
    <g stroke="#6b4c9a"><circle cx="58" cy="228" r="20"/><path d="M28 278 q30 -36 60 0"/></g>
  </g>
  <!-- microphone on a stand -->
  <g stroke="#3a3a3a" stroke-width="4" fill="none" stroke-linecap="round">
    <rect x="248" y="208" width="24" height="40" rx="12" fill="#c9c2b6"/>
    <path d="M240 236 q20 26 40 0"/>
    <line x1="260" y1="249" x2="260" y2="284"/>
    <line x1="238" y1="286" x2="282" y2="286"/>
  </g>
  <!-- sound arcs from mic to dial -->
  <g stroke="#9a9184" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M232 214 q-12 -10 -10 -24"/><path d="M222 222 q-20 -16 -16 -38"/>
  </g>
</svg>
