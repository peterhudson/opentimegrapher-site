<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="A brass loupe over a balance wheel, with a small green tick in the lens">
  <rect width="320" height="320" fill="#1f2a36"/>
  <!-- Balance wheel -->
  <g transform="translate(140 175)" fill="none" stroke="#c9a45c">
    <circle r="92" stroke-width="10"/>
    <circle r="12" stroke-width="6"/>
    <g stroke-width="7">
      <line x1="0" y1="-12" x2="0" y2="-87"/>
      <line x1="0" y1="12" x2="0" y2="87"/>
      <line x1="-12" y1="0" x2="-87" y2="0"/>
      <line x1="12" y1="0" x2="87" y2="0"/>
    </g>
    <g fill="#c9a45c" stroke="none">
      <circle cx="0" cy="-97" r="5"/><circle cx="0" cy="97" r="5"/>
      <circle cx="-97" cy="0" r="5"/><circle cx="97" cy="0" r="5"/>
      <circle cx="68.6" cy="-68.6" r="5"/><circle cx="-68.6" cy="68.6" r="5"/>
      <circle cx="-68.6" cy="-68.6" r="5"/><circle cx="68.6" cy="68.6" r="5"/>
    </g>
    <!-- Hairspring -->
    <path d="M0 -20 A20 20 0 1 1 -18 9 A28 28 0 1 1 6 -36 A38 38 0 1 1 -40 20" stroke="#8fa3b8" stroke-width="2.5"/>
  </g>
  <!-- Loupe -->
  <g transform="translate(205 110)">
    <circle r="62" fill="#e8f1f8" fill-opacity="0.18" stroke="#b08a3e" stroke-width="12"/>
    <circle r="62" fill="none" stroke="#f0d79a" stroke-width="3"/>
    <path d="M-22 2 L-6 18 L26 -16" fill="none" stroke="#5cc28a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="40" width="22" height="70" rx="8" fill="#6b5328" transform="rotate(-45 51 75)"/>
  </g>
</svg>
