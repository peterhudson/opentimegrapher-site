<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t">
  <title id="t">Hugh: a face made of a layout grid, one eye behind a watchmaker's loupe, with a ruler for a smile</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a4d"/>
      <stop offset="1" stop-color="#14232e"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e9f6f4"/>
      <stop offset="1" stop-color="#9fd3cb"/>
    </radialGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#2b8a7e" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#bg)"/>
  <!-- the head: a pane, with a title bar -->
  <rect x="56" y="58" width="208" height="216" rx="28" fill="#f4efe6"/>
  <rect x="56" y="58" width="208" height="216" rx="28" fill="url(#grid)"/>
  <path d="M84 58h152a28 28 0 0 1 28 28v8H56v-8a28 28 0 0 1 28-28z" fill="#2b8a7e"/>
  <circle cx="84" cy="76" r="5" fill="#f4efe6" fill-opacity="0.85"/>
  <circle cx="100" cy="76" r="5" fill="#f4efe6" fill-opacity="0.55"/>
  <circle cx="116" cy="76" r="5" fill="#f4efe6" fill-opacity="0.3"/>
  <!-- left eye -->
  <circle cx="120" cy="150" r="11" fill="#1d2a33"/>
  <circle cx="124" cy="146" r="3.5" fill="#f4efe6"/>
  <!-- right eye, behind a loupe -->
  <circle cx="204" cy="148" r="38" fill="#1d2a33"/>
  <circle cx="204" cy="148" r="30" fill="url(#lens)"/>
  <circle cx="204" cy="150" r="15" fill="#1d2a33"/>
  <circle cx="210" cy="143" r="5" fill="#f4efe6"/>
  <path d="M184 132a26 26 0 0 1 22-12" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <!-- brows: one level, one raised in thought -->
  <path d="M104 124h32" stroke="#1d2a33" stroke-width="6" stroke-linecap="round"/>
  <path d="M178 100l40-6" stroke="#1d2a33" stroke-width="6" stroke-linecap="round"/>
  <!-- a ruler for a smile -->
  <path d="M106 214q54 30 108 0" fill="none" stroke="#e0a63a" stroke-width="14" stroke-linecap="round"/>
  <g stroke="#1d2a33" stroke-width="2.5" stroke-linecap="round">
    <path d="M118 214.5v7"/><path d="M132 221.5v5"/><path d="M146 225.5v7"/><path d="M160 227v5"/>
    <path d="M174 225.5v7"/><path d="M188 221.5v5"/><path d="M202 214.5v7"/>
  </g>
  <!-- a cheek: one small accent mark -->
  <circle cx="98" cy="186" r="9" fill="#e0a63a" fill-opacity="0.35"/>
</svg>
