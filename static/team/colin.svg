<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t">
  <title id="t">Colin: a stopwatch with a friendly face, ringed by eight green checks</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3b4f"/>
      <stop offset="1" stop-color="#0f2230"/>
    </linearGradient>
    <radialGradient id="face" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#e3dccb"/>
    </radialGradient>
  </defs>
  <rect width="320" height="320" rx="36" fill="url(#bg)"/>
  <!-- pipeline track behind the head -->
  <path d="M0 250 H320" stroke="#2f5870" stroke-width="10" stroke-dasharray="18 12"/>
  <!-- crown and pushers -->
  <rect x="146" y="40" width="28" height="22" rx="5" fill="#c9a24a"/>
  <rect x="152" y="30" width="16" height="14" rx="4" fill="#d9b562"/>
  <rect x="226" y="70" width="22" height="14" rx="4" fill="#c9a24a" transform="rotate(45 237 77)"/>
  <!-- case -->
  <circle cx="160" cy="165" r="104" fill="#c9a24a"/>
  <circle cx="160" cy="165" r="94" fill="url(#face)"/>
  <!-- eight checks around the bezel -->
  <g fill="#3fae6a" stroke="#fbf7ee" stroke-width="2">
    <circle cx="160" cy="88" r="11"/><circle cx="214.4" cy="110.6" r="11"/>
    <circle cx="237" cy="165" r="11"/><circle cx="214.4" cy="219.4" r="11"/>
    <circle cx="160" cy="242" r="11"/><circle cx="105.6" cy="219.4" r="11"/>
    <circle cx="83" cy="165" r="11"/><circle cx="105.6" cy="110.6" r="11"/>
  </g>
  <g fill="none" stroke="#fbf7ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M155 88 l4 4 l7 -7"/><path d="M209.4 110.6 l4 4 l7 -7"/>
    <path d="M232 165 l4 4 l7 -7"/><path d="M209.4 219.4 l4 4 l7 -7"/>
    <path d="M155 242 l4 4 l7 -7"/><path d="M100.6 219.4 l4 4 l7 -7"/>
    <path d="M78 165 l4 4 l7 -7"/><path d="M100.6 110.6 l4 4 l7 -7"/>
  </g>
  <!-- face -->
  <ellipse cx="135" cy="152" rx="9" ry="12" fill="#1d3b4f"/>
  <ellipse cx="185" cy="152" rx="9" ry="12" fill="#1d3b4f"/>
  <circle cx="138" cy="148" r="3" fill="#fbf7ee"/>
  <circle cx="188" cy="148" r="3" fill="#fbf7ee"/>
  <path d="M132 188 Q160 212 188 188" fill="none" stroke="#1d3b4f" stroke-width="6" stroke-linecap="round"/>
  <!-- hand pointing up: on time -->
  <circle cx="160" cy="165" r="5" fill="#b8412f"/>
  <path d="M160 165 L160 118" stroke="#b8412f" stroke-width="4" stroke-linecap="round"/>
</svg>
