<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Walter: a round dial face peering through a watchmaker's loupe, holding a screenshot frame">
  <rect width="320" height="320" rx="36" fill="#1f2a36"/>
  <circle cx="160" cy="300" r="120" fill="#2d3e50"/>
  <!-- body -->
  <path d="M88 320 C92 250 228 250 232 320 Z" fill="#3a6e8f"/>
  <!-- head: a dial -->
  <circle cx="160" cy="150" r="78" fill="#f2efe6" stroke="#c9b27c" stroke-width="8"/>
  <g stroke="#3b3b3b" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="80" x2="160" y2="92"/><line x1="160" y1="208" x2="160" y2="220"/>
    <line x1="90" y1="150" x2="102" y2="150"/><line x1="218" y1="150" x2="230" y2="150"/>
  </g>
  <!-- eyes: one plain, one behind a loupe -->
  <circle cx="132" cy="140" r="7" fill="#2b2b2b"/>
  <circle cx="190" cy="138" r="26" fill="#bfe3f2" stroke="#2b2b2b" stroke-width="7"/>
  <circle cx="190" cy="138" r="11" fill="#2b2b2b"/>
  <circle cx="185" cy="133" r="4" fill="#ffffff"/>
  <rect x="210" y="118" width="22" height="12" rx="4" fill="#2b2b2b" transform="rotate(-20 221 124)"/>
  <!-- mouth: a small rate trace -->
  <polyline points="128,182 140,182 146,174 152,190 158,178 164,184 192,184" fill="none" stroke="#c2185b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hand holding a screenshot frame with a check -->
  <rect x="34" y="214" width="78" height="58" rx="6" fill="#f2efe6" stroke="#c9b27c" stroke-width="4"/>
  <polyline points="56,244 68,256 92,230" fill="none" stroke="#2e7d32" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="112" cy="262" r="12" fill="#3a6e8f"/>
</svg>
