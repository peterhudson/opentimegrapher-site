<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Lewis: a watch dial with a friendly face, speech bubbles in several languages around it">
  <rect width="320" height="320" rx="24" fill="#20314a"/>
  <!-- speech bubbles -->
  <g font-family="'Noto Sans', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" font-weight="600" text-anchor="middle">
    <g fill="#f2c14e"><rect x="14" y="20" width="86" height="34" rx="17"/><path d="M60 52 l10 14 l4 -16z"/></g>
    <text x="57" y="43" fill="#20314a">Hallo</text>
    <g fill="#7fc8c2"><rect x="214" y="18" width="92" height="34" rx="17"/><path d="M246 50 l-10 14 l18 -12z"/></g>
    <text x="260" y="41" fill="#20314a">你好</text>
    <g fill="#e58fb0"><rect x="10" y="262" width="104" height="34" rx="17"/><path d="M76 264 l14 -14 l2 16z"/></g>
    <text x="62" y="285" fill="#20314a">Bonjour</text>
    <g fill="#b8a4e8"><rect x="208" y="262" width="100" height="34" rx="17"/><path d="M236 264 l-12 -14 l20 10z"/></g>
    <text x="258" y="285" fill="#20314a">こんにちは</text>
  </g>
  <!-- the dial -->
  <circle cx="160" cy="160" r="96" fill="#c9ced6"/>
  <circle cx="160" cy="160" r="86" fill="#f7f4ec"/>
  <g stroke="#20314a" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="80" x2="160" y2="92"/><line x1="240" y1="160" x2="228" y2="160"/>
    <line x1="160" y1="240" x2="160" y2="228"/><line x1="80" y1="160" x2="92" y2="160"/>
  </g>
  <g stroke="#20314a" stroke-width="2" stroke-linecap="round">
    <line x1="200" y1="90.7" x2="196" y2="97.7"/><line x1="229.3" y1="120" x2="222.3" y2="124"/>
    <line x1="229.3" y1="200" x2="222.3" y2="196"/><line x1="200" y1="229.3" x2="196" y2="222.3"/>
    <line x1="120" y1="229.3" x2="124" y2="222.3"/><line x1="90.7" y1="200" x2="97.7" y2="196"/>
    <line x1="90.7" y1="120" x2="97.7" y2="124"/><line x1="120" y1="90.7" x2="124" y2="97.7"/>
  </g>
  <!-- face -->
  <ellipse cx="134" cy="146" rx="9" ry="12" fill="#20314a"/>
  <ellipse cx="186" cy="146" rx="9" ry="12" fill="#20314a"/>
  <circle cx="137" cy="142" r="3" fill="#f7f4ec"/><circle cx="189" cy="142" r="3" fill="#f7f4ec"/>
  <path d="M128 186 q32 28 64 0" fill="none" stroke="#20314a" stroke-width="5" stroke-linecap="round"/>
  <!-- crown -->
  <rect x="254" y="150" width="14" height="20" rx="3" fill="#c9ced6"/>
</svg>
