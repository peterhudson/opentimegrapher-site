<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="A balance wheel drawn as a face inside an app window">
  <rect width="320" height="320" fill="#1d2430"/>
  <!-- the app window -->
  <rect x="28" y="36" width="264" height="248" rx="14" fill="#263040" stroke="#4a5a72" stroke-width="3"/>
  <rect x="28" y="36" width="264" height="34" rx="14" fill="#33415a"/>
  <rect x="28" y="56" width="264" height="14" fill="#33415a"/>
  <circle cx="50" cy="53" r="6" fill="#e07a5f"/>
  <circle cx="70" cy="53" r="6" fill="#f2cc8f"/>
  <circle cx="90" cy="53" r="6" fill="#81b29a"/>
  <!-- the balance wheel as a face -->
  <circle cx="160" cy="176" r="86" fill="none" stroke="#d9a441" stroke-width="12"/>
  <circle cx="160" cy="176" r="74" fill="#2c3a50"/>
  <g fill="#d9a441">
    <circle cx="160" cy="90" r="5"/><circle cx="246" cy="176" r="5"/>
    <circle cx="160" cy="262" r="5"/><circle cx="74" cy="176" r="5"/>
    <circle cx="221" cy="115" r="4"/><circle cx="221" cy="237" r="4"/>
    <circle cx="99" cy="237" r="4"/><circle cx="99" cy="115" r="4"/>
  </g>
  <!-- spokes, ending in eyes -->
  <line x1="160" y1="176" x2="128" y2="146" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="176" x2="192" y2="146" stroke="#d9a441" stroke-width="6" stroke-linecap="round"/>
  <circle cx="128" cy="146" r="11" fill="#f4efe6"/><circle cx="131" cy="148" r="5" fill="#1d2430"/>
  <circle cx="192" cy="146" r="11" fill="#f4efe6"/><circle cx="195" cy="148" r="5" fill="#1d2430"/>
  <circle cx="160" cy="176" r="7" fill="#9fb8d8"/>
  <!-- hairspring smile -->
  <path d="M118 196 Q160 236 202 196" fill="none" stroke="#9fb8d8" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 200 Q160 226 190 200" fill="none" stroke="#9fb8d8" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- a cursor, as the app's developer -->
  <path d="M236 228 L236 262 L245 253 L252 268 L258 265 L251 250 L263 250 Z" fill="#f4efe6" stroke="#1d2430" stroke-width="2"/>
</svg>
