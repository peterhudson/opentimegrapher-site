<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t">
  <title id="t">Dillon: a folded trail map with a dashed path through six numbered waypoints to a small wristwatch, and a compass</title>
  <rect width="320" height="320" fill="#5f7d64"/>
  <!-- folded map: three panels -->
  <polygon points="34,70 118,52 118,262 34,280" fill="#f3ead2"/>
  <polygon points="118,52 202,70 202,280 118,262" fill="#e6dbbd"/>
  <polygon points="202,70 286,52 286,262 202,280" fill="#f3ead2"/>
  <g stroke="#cdbf98" stroke-width="1" fill="none">
    <path d="M44 120 Q80 104 112 118"/><path d="M44 170 Q86 150 112 166"/>
    <path d="M124 110 Q160 96 196 112"/><path d="M208 214 Q246 198 278 210"/>
    <path d="M208 160 Q250 142 278 156"/><path d="M124 228 Q160 214 196 226"/>
  </g>
  <!-- trail -->
  <path d="M62 246 C90 222 80 196 104 184 S150 190 158 160 S136 116 170 104 S232 122 238 150 S226 196 252 206"
        fill="none" stroke="#b5452f" stroke-width="3.5" stroke-dasharray="7 6" stroke-linecap="round"/>
  <g font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#fffaf0">
    <circle cx="62" cy="246" r="11" fill="#2f4a5c"/><text x="62" y="251">1</text>
    <circle cx="104" cy="184" r="11" fill="#2f4a5c"/><text x="104" y="189">2</text>
    <circle cx="158" cy="160" r="11" fill="#2f4a5c"/><text x="158" y="165">3</text>
    <circle cx="170" cy="104" r="11" fill="#2f4a5c"/><text x="170" y="109">4</text>
    <circle cx="238" cy="150" r="11" fill="#2f4a5c"/><text x="238" y="155">5</text>
    <circle cx="214" cy="194" r="11" fill="#2f4a5c"/><text x="214" y="199">6</text>
  </g>
  <!-- wristwatch at the trail's end -->
  <g transform="translate(258 216)">
    <rect x="-9" y="-34" width="18" height="68" rx="5" fill="#7a5a3a"/>
    <circle r="19" fill="#c9a24a"/>
    <circle r="15" fill="#fffdf6"/>
    <g stroke="#333" stroke-width="1.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-10"/><line x1="0" y1="0" x2="7" y2="3"/>
    </g>
    <circle r="1.8" fill="#b5452f"/>
  </g>
  <!-- compass -->
  <g transform="translate(68 92)">
    <circle r="22" fill="#fffaf0" stroke="#2f4a5c" stroke-width="2.5"/>
    <polygon points="0,-17 5,0 0,17 -5,0" fill="#2f4a5c"/>
    <polygon points="0,-17 5,0 -5,0" fill="#b5452f"/>
    <text y="-25" font-family="Georgia, serif" font-size="11" text-anchor="middle" fill="#fffaf0">N</text>
  </g>
</svg>
