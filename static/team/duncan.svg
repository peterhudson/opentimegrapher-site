<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" rx="24" fill="#f3efe6"/>
  <!-- folder forehead -->
  <path d="M86 70 h52 l14 14 h82 a10 10 0 0 1 10 10 v22 H76 V80 a10 10 0 0 1 10-10z" fill="#d9a441"/>
  <!-- head -->
  <rect x="76" y="100" width="168" height="120" rx="26" fill="#2f6f73"/>
  <rect x="92" y="116" width="136" height="88" rx="18" fill="#e9f3f1"/>
  <!-- eyes -->
  <circle cx="132" cy="150" r="11" fill="#1d3c3f"/>
  <circle cx="188" cy="150" r="11" fill="#1d3c3f"/>
  <circle cx="136" cy="146" r="3.5" fill="#fff"/>
  <circle cx="192" cy="146" r="3.5" fill="#fff"/>
  <!-- sound-wave smile -->
  <path d="M122.0 174.0 L130.4 177.7 L138.8 186.0 L147.2 182.8 L155.6 192.0 L164.0 183.6 L172.4 190.1 L180.8 181.4 L189.2 181.5 L197.6 174.3" fill="none" stroke="#7b4fa8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- antenna -->
  <line x1="160" y1="70" x2="160" y2="52" stroke="#2f6f73" stroke-width="4"/>
  <circle cx="160" cy="46" r="7" fill="#d9a441"/>
  <!-- dotted line from head down to dial -->
  <line x1="160" y1="222" x2="160" y2="246" stroke="#7b4fa8" stroke-width="4" stroke-dasharray="2 6" stroke-linecap="round"/>
  <!-- watch dial -->
  <circle cx="160" cy="280" r="30" fill="#fffaf0" stroke="#b5862e" stroke-width="5"/>
  <g stroke="#1d3c3f" stroke-width="2.5" stroke-linecap="round">
    <line x1="160" y1="256" x2="160" y2="262"/>
    <line x1="184" y1="280" x2="178" y2="280"/>
    <line x1="160" y1="304" x2="160" y2="298"/>
    <line x1="136" y1="280" x2="142" y2="280"/>
    <line x1="160" y1="280" x2="160" y2="264" stroke-width="3"/>
    <line x1="160" y1="280" x2="172" y2="286" stroke-width="3"/>
  </g>
  <circle cx="160" cy="280" r="3" fill="#b5862e"/>
  <!-- small green check on the folder -->
  <path d="M206 88 l7 7 l13 -14" fill="none" stroke="#3b9a5a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
