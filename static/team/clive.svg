<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="A small chart whose falling line becomes a smile, two table cells for eyes, and a ruler lining them all up on one left edge">
  <rect width="320" height="320" fill="#22262e"/>
  <!-- face: a chart frame -->
  <rect x="70" y="58" width="200" height="214" rx="14" fill="#2f3540" stroke="#8a93a3" stroke-width="3"/>
  <!-- eyes: two table cells, one grey -->
  <rect x="104" y="98" width="46" height="26" rx="4" fill="#e9edf3"/>
  <rect x="190" y="98" width="46" height="26" rx="4" fill="#7b8494"/>
  <circle cx="127" cy="111" r="6" fill="#22262e"/>
  <circle cx="213" cy="111" r="6" fill="#22262e"/>
  <!-- nose: a single beat tick -->
  <line x1="170" y1="140" x2="170" y2="168" stroke="#e0b44c" stroke-width="5" stroke-linecap="round"/>
  <!-- smile: a power reserve curve, level then falling, then turning up -->
  <path d="M104 196 C140 200 170 204 196 214 C214 222 226 222 236 206" fill="none" stroke="#e05a9a" stroke-width="6" stroke-linecap="round"/>
  <!-- hour ticks along the bottom -->
  <g stroke="#8a93a3" stroke-width="3">
    <line x1="104" y1="244" x2="104" y2="254"/>
    <line x1="137" y1="244" x2="137" y2="254"/>
    <line x1="170" y1="244" x2="170" y2="254"/>
    <line x1="203" y1="244" x2="203" y2="254"/>
    <line x1="236" y1="244" x2="236" y2="254"/>
  </g>
  <!-- the ruler: one left edge for chart, cells and table -->
  <line x1="104" y1="34" x2="104" y2="296" stroke="#4fc3a1" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M96 34 L104 22 L112 34 Z" fill="#4fc3a1"/>
</svg>
