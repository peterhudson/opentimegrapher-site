<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="15">
<title id="t">Adapter wiring after the fix</title>
<desc id="d">The adapter's GX16 socket seen from the front, key up: hole 3 top left, hole 1 top right, hole 2 at the bottom. Hole 2 (signal) goes to the plug's tip, hole 3 (ground) to its sleeve, hole 1 (+8 V) is left empty.</desc>
<rect width="640" height="340" fill="#fff"/>
<text x="140" y="28" text-anchor="middle" font-weight="600">GX16 socket, front, key up</text>
<circle cx="140" cy="150" r="95" fill="#2b2b2b"/>
<path d="M128 56 a12 12 0 0 0 24 0" fill="#fff"/>
<circle cx="100" cy="122" r="17" fill="#888"/><text x="100" y="127" text-anchor="middle" fill="#fff" font-weight="700">3</text>
<circle cx="180" cy="122" r="17" fill="#888"/><text x="180" y="127" text-anchor="middle" fill="#fff" font-weight="700">1</text>
<circle cx="140" cy="192" r="17" fill="#888"/><text x="140" y="197" text-anchor="middle" fill="#fff" font-weight="700">2</text>
<text x="20" y="282" fill="#333">1 = +8 V supply: leave empty</text>
<text x="20" y="304" fill="#333">2 = signal (rests near +4 V)</text>
<text x="20" y="326" fill="#333">3 = ground</text>
<rect x="430" y="120" width="70" height="40" rx="6" fill="#333"/>
<rect x="500" y="130" width="70" height="20" fill="#bbb"/>
<rect x="570" y="132" width="40" height="16" rx="8" fill="#bbb"/>
<rect x="566" y="128" width="5" height="24" fill="#333"/>
<text x="530" y="118" text-anchor="middle">sleeve</text><text x="590" y="118" text-anchor="middle">tip</text>
<text x="520" y="90" text-anchor="middle" font-weight="600">3.5 mm mono (TS) plug</text>
<path d="M157 192 C 300 260, 600 250, 592 148" fill="none" stroke="#c2185b" stroke-width="4"/>
<path d="M100 105 C 160 30, 380 30, 430 140" fill="none" stroke="#555" stroke-width="4"/>
<text x="380" y="262" fill="#c2185b">signal to tip</text>
<text x="262" y="44" fill="#555">ground to sleeve</text>
</svg>
